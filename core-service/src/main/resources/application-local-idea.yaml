spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/core_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: core_service
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: core_service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.ssm.events"

app:
  outbox:
    poll-interval-ms: 5000
    recovery-interval-ms: 300000

logging:
  level:
    com.ssm.auth_service: TRACE
    org:
      springframework:
        security: DEBUG
        web: DEBUG
        core:
          env: DEBUG
        kafka: DEBUG
      flywaydb: DEBUG