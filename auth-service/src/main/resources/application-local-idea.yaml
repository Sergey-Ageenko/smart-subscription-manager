spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: auth_service
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth_service

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

    properties:
      schema.registry.url: http://localhost:8086

jwt:
  secret: "TGm9uN/S0kF0aGVf5iLJ7vrESh+rMMIqTZLGanm+od/vraHRrU5xyQN9DCkpTnjUwiaHrufbGewLkDlCycLtFw=="
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: "auth-service"
  audiences: core-service, billing-service


app:
  outbox:
    poll-interval-ms: 5000
    recovery-interval-ms: 300000

  cookie:
    secure: false
    max-age: 7d

logging:
  level:
    com.ssm.auth_service: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org:
      springframework:
        security: DEBUG
        web: DEBUG
        core:
          env: DEBUG
      flywaydb: DEBUG